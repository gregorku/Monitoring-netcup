###############################################################################
#
# Monitoring-Grafana Project
#
# File:
#   configs/grafana/grafana.ini
#
# Description:
#   Grafana base configuration.
#
#   Secrets (admin user/password) and the public
#   domain/root URL are injected via environment
#   variables in compose/50-grafana.yml (GF_* vars),
#   not hardcoded here.
#
###############################################################################

[server]
protocol = http
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[security]
disable_gravatar = true
cookie_secure = true

[users]
allow_sign_up = false
default_theme = dark

[auth.anonymous]
enabled = false

[log]
mode = console
level = info

###############################################################################
# Authentik ForwardAuth
#
# Grafana trusts identity headers supplied by Traefik after
# successful authentication by Authentik.
#
# Only the Traefik container's observed source address is trusted.
# Do not disable Grafana's login form until proxy authentication
# has been tested successfully.
###############################################################################

[auth.proxy]
enabled = true
header_name = X-authentik-username
header_property = username
auto_sign_up = true
sync_ttl = 15
whitelist = 10.10.10.10/32
headers = Name:X-authentik-name Email:X-authentik-email